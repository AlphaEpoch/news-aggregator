<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Job Radar</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #0f172a;
            color: #f8fafc;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .job-card {
            background: #1e293b;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: border-color 0.2s;
        }
        .job-card:hover {
            border-color: #38bdf8;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .timestamp {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🎯 Daily Job Radar</h1>
            <p class="timestamp">Last updated: 2026-11-20 16:34 UTC</p>
        </div>
        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>
<p style="color: #94a3b8;">No jobs found or scraper selectors need adjustment.</p>
</body>
</html>

name: Daily Job Scraper

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab anytime

permissions:
  contents: write # Required so the action can commit jobs.html back to your repo

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scrape_jobs.py

      - name: Commit and push if changes detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily jobs feed [skip ci]" && git push)
